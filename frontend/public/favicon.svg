<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- CampusCycle Brand Favicon: Navy #102A43 & Green #22A06B -->
  <!-- Rounded squircle badge in Navy -->
  <rect width="32" height="32" rx="8" fill="#102A43"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#22A06B" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Upper Cycle Arrow (Green #22A06B) -->
  <path d="M23.8 13.5C23.2 9.5 20 6.5 16 6.5C12.2 6.5 9.2 8.8 8.2 12" stroke="#22A06B" stroke-width="2.25" stroke-linecap="round"/>
  <polygon points="25.5,12 23.5,16 20.2,12.8" fill="#22A06B"/>

  <!-- Lower Cycle Arrow (Green #22A06B) -->
  <path d="M8.2 18.5C8.8 22.5 12 25.5 16 25.5C19.8 25.5 22.8 23.2 23.8 20" stroke="#22A06B" stroke-width="2.25" stroke-linecap="round"/>
  <polygon points="6.5,20 8.5,16 11.8,19.2" fill="#22A06B"/>

  <!-- Center Graduation Mortarboard (White cap + Green base & tassel) -->
  <!-- Diamond Top in White for crisp contrast at 16x16 and 32x32 -->
  <polygon points="16,11.2 23.5,15 16,18.8 8.5,15" fill="#FFFFFF"/>
  <!-- Cap Skullcap -->
  <path d="M11.5 16.5V19C11.5 20.5 13.5 21.5 16 21.5C18.5 21.5 20.5 20.5 20.5 19V16.5" fill="#22A06B"/>
  <!-- Center Cap Button -->
  <circle cx="16" cy="15" r="0.9" fill="#22A06B"/>
  <!-- Tassel -->
  <path d="M16 15L21.5 17.5V19.5" stroke="#22A06B" stroke-width="1" stroke-linecap="round"/>
  <circle cx="21.5" cy="20" r="0.8" fill="#22A06B"/>
</svg>
